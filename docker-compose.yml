services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: publicador
      POSTGRES_PASSWORD: publicador
      POSTGRES_DB: publicador
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U publicador -d publicador']
      interval: 2s
      timeout: 5s
      retries: 20
    volumes:
      - publicador-postgres-data:/var/lib/postgresql/data

volumes:
  publicador-postgres-data:
