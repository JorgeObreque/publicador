services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: publicador
      POSTGRES_PASSWORD: publicador
      POSTGRES_DB: publicador_test
    ports:
      - '127.0.0.1:5434:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U publicador -d publicador_test']
      interval: 2s
      timeout: 5s
      retries: 20
    tmpfs:
      - /var/lib/postgresql/data
