services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: publicador
      POSTGRES_PASSWORD: publicador
      POSTGRES_DB: publicador
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U publicador -d publicador']
      interval: 2s
      timeout: 5s
      retries: 20
    volumes:
      - publicador-postgres-data:/var/lib/postgresql/data
    networks:
      - publicador-net

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: production
      API_PORT: 3001
      API_PREFIX: api/v1
      # DATABASE_URL apunta al servicio `postgres` de la red interna;
      # las credenciales coinciden con el bloque `postgres` de arriba.
      DATABASE_URL: postgresql://publicador:publicador@postgres:5432/publicador?schema=public
      BUSINESS_ID: blondor
      BUSINESS_TIMEZONE: America/Santiago
      BUSINESS_CURRENCY: CLP
      PUBLICADOR_PUBLIC_BASE_URL: http://localhost:3001
      # Permite al entrypoint encontrar el host del Postgres.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '127.0.0.1:3001:3001'
    restart: unless-stopped
    networks:
      - publicador-net

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_BASE_URL: http://localhost:3001/api/v1
    env_file:
      - .env
    depends_on:
      - api
    ports:
      - '127.0.0.1:3000:3000'
    restart: unless-stopped
    networks:
      - publicador-net

networks:
  publicador-net:
    driver: bridge

volumes:
  publicador-postgres-data:
